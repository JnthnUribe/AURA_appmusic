[project]
name = "aura-backend"
version = "0.1.0"
description = "Aura personal music app — API and worker"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary,pool]>=3.2",
  "uuid-utils>=0.10",
  "pwdlib[argon2]>=0.2",
  "pyjwt>=2.10",
  "httpx>=0.28",
  "structlog>=24.4",
  "python-multipart>=0.0.20",
  "slowapi>=0.1.9",
  "tenacity>=9.0",
  "boto3>=1.35",
  "yt-dlp>=2025.11.12",
  "ytmusicapi>=1.10",
  "mutagen>=1.47",
  "pillow>=11.0",
  "rapidfuzz>=3.11",
  "aiolimiter>=1.2",
  "sentry-sdk[fastapi]>=2.19",
  "anthropic>=0.49",
]

[project.scripts]
aura = "aura.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "respx>=0.22",
  "ruff>=0.9",
  "pyright>=1.1.391",
  "pre-commit>=4.0",
  "faker>=33.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
  "integration: needs a real PostgreSQL (AURA_TEST_DATABASE_URL)",
]
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "RUF", "S"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"alembic/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
exclude = ["alembic/versions", ".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportUnnecessaryIsInstance = false
