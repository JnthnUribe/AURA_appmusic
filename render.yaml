services:
  - type: web
    name: aura-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WORKER_TOKEN
        generateValue: true
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_AUDIO
        value: aura-audio
      - key: R2_BUCKET_ART
        value: aura-art
      - key: CORS_ORIGINS
        value: '["https://aura.invalid"]'
      - key: SENTRY_DSN
        sync: false
