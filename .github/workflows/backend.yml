name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aura_test
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aura -d aura_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      JWT_SECRET: test-secret-that-is-long-enough-123456
      DATABASE_URL: postgresql+psycopg://aura:aura@localhost:5432/aura_test
      DIRECT_DATABASE_URL: postgresql+psycopg://aura:aura@localhost:5432/aura_test
      AURA_TEST_DATABASE_URL: postgresql+psycopg://aura:aura@localhost:5432/aura_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: aura-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [quality, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not configured; skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
